name: Robo diario da Carteira Cripto

on:
  schedule:
    - cron: "10 11 * * *"   # 08:10 em Campo Grande (UTC-4)
  workflow_dispatch:
    inputs:
      tese:
        description: "Gerar a tese por IA nesta execução?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  carteira:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Cuiaba
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CARTEIRA_CHAVE: ${{ secrets.CARTEIRA_CHAVE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gravar o histórico do dia
        run: python -m carteira snapshot
      - name: Tese semanal (segundas ou sob demanda)
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event.inputs.tese }}" = "true" ]; then python -m carteira tese; else echo "Hoje não é segunda."; fi
      - name: Salvar
        run: |
          git config user.name "carteira-robo"
          git config user.email "carteira-robo@users.noreply.github.com"
          git add data/
          git commit -m "Carteira $(date +'%d/%m/%Y %H:%M')" || echo "Sem mudanças"
          git push
