name: Gerar app Android (APK)

on:
  workflow_dispatch:
  push:
    paths: ["android/**", "scripts/robo_app_android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CarteiraCripto.apk
      - name: Publicar na pagina de downloads (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: "Carteira Cripto - app Android"
          body: "Baixe o CarteiraCripto.apk no celular e instale. Atualizado automaticamente a cada mudança no app."
          files: CarteiraCripto.apk
          make_latest: true
